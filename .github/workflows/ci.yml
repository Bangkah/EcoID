name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check app scripts tests

  tests:
    name: tests (py${{ matrix.python }}, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Node runs the page's real JavaScript against the real server (tests/ui/smoke.js).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile everything (catches syntax errors in torch-only scripts too)
        run: python -m compileall -q app scripts tests

      # CI=true is set by GitHub: the UI-script test FAILS instead of skipping if node is missing.
      - name: Run test suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v

      # Windows decodes text as cp1252 by default; ASCII-only defaults are stricter still. Running the suite this way on Linux
      # catches "works here, crashes on Windows" bugs (e.g. read_text() without encoding) without waiting for the Windows job.
      - name: Run test suite with a non-UTF-8 default encoding (Windows emulation)
        if: matrix.python == '3.12'
        env:
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
          LC_ALL: C
        run: python -W error::ResourceWarning -m unittest discover -s tests -t .

      # Report only: never decides pass/fail.
      - name: Coverage report
        if: matrix.python == '3.12'
        continue-on-error: true
        run: |
          pip install "coverage>=7"
          python -m coverage run --branch --source=app -m unittest discover -s tests -t .
          echo "### Coverage (app/)" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --skip-empty --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage html -d reports/coverage

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12' && always()
        with:
          name: coverage-html
          path: reports/coverage/
          if-no-files-found: ignore

  # Real Chromium (headless) against the real server: capture -> result -> verify -> history -> edit -> delete,
  # low-confidence banner, model info, phone viewport, dark mode, Chromium's fake camera, no outbound requests,
  # no JavaScript errors. Screenshots of every state are uploaded as an artifact for human review.
  ui-e2e:
    name: ui-e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-browser.txt
          playwright install --with-deps chromium
      - name: Browser tests
        env:
          ECOID_BROWSER_TESTS: "1"
          ECOID_SCREENSHOTS: reports/screenshots
        run: python -m unittest tests.ui_browser.test_browser_flow -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: reports/screenshots/
          if-no-files-found: ignore

  # Same suite on Windows (the app targets laptops). Reported but non-blocking until it has been seen green once;
  # then delete the `continue-on-error` line and add it to branch protection (docs/ci.md).
  tests-windows:
    name: tests (py3.12, windows - experimental)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
